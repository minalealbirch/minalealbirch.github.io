<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Comments</title>
<style>*{box-sizing:border-box}body{max-width:44rem;margin:4rem auto;padding:0 1.25rem;background:#faf9f6;color:#203039;font:17px/1.55 system-ui}h1{font:3rem Georgia}article,form{border-top:1px solid #cbcfc9;padding:1rem 0}p{white-space:pre-wrap;overflow-wrap:anywhere}label,input,textarea{display:block;width:100%}input,textarea,button{font:inherit;padding:.6rem}label,button{margin-top:.7rem}button{cursor:pointer}time{display:block;font-size:.85rem;color:#425760}</style>
<main><h1>Comments</h1><form hidden><label>Your display name<input required maxlength="60" name="author"></label><label>Your comment<textarea required maxlength="2000" rows="4" name="body"></textarea></label><button>Post comment</button></form><p id="status" role="status"></p><section aria-label="Comments" id="posts"></section><button id="refresh" hidden>Refresh comments</button></main>
<script type="module">
import {endpoint} from './settings.js';
const form=document.querySelector('form'), status=document.querySelector('#status'), posts=document.querySelector('#posts'), refresh=document.querySelector('#refresh');
const key=new URLSearchParams(location.hash.slice(1)).get('key');
async function load(){
 try{
  const response=await fetch(endpoint,{cache:'no-store'});
  if(!response.ok) throw Error();
  const rows=await response.json(), cards=[];
  for(const row of rows){
   const card=document.createElement('article'), author=document.createElement('strong'), time=document.createElement('time'), body=document.createElement('p');
   author.textContent=row.author; time.dateTime=row.created; time.textContent=new Date(row.created).toLocaleString(); body.textContent=row.body;
   card.append(author,time,body);cards.push(card);
  }
  posts.replaceChildren(...cards); status.textContent=rows.length?'':'No comments yet.';
 }catch{status.textContent='Could not load comments. Please try refreshing.'}
}
if(endpoint){form.hidden=!key;refresh.hidden=false;refresh.onclick=load;load()}else{status.textContent='The comments service has not been connected yet.'}
form.onsubmit=async event=>{
 event.preventDefault();const button=form.querySelector('button');button.disabled=true;
 try{
  const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});
  if(!response.ok){status.textContent=response.status===403?'This commenter link is invalid.':'Could not post. Check your name and comment.';return}
  form.elements.body.value='';await load();
 }catch{status.textContent='Connection interrupted. Refresh before trying again.'}finally{button.disabled=false}
};
</script></html>
